<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YC LEE ARCHITECT</title>
  <style>
    /* ---------- 全局样式 ---------- */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #0c1c36, #061224);
      color: white;
      overflow-x: hidden;
      min-height: 100vh;
    }
    
    * {
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  -webkit-focus-ring-color: rgba(0,0,0,0);
  outline: none !important;
}

    /* ---------- Header ---------- */
    header {
      background-color: rgba(10, 25, 50, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 18px 60px;
      border-bottom: 2px solid rgba(255, 166, 0, 0.5);
      position: relative;
      z-index: 5;
    }

    .header-left {
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .logo-text {
      font-size: 1.7rem;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .yc { color: orange; }

    /* ---------- 导航栏（竖排） ---------- */
    nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 100px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
      white-space: nowrap;
      transition: color 0.3s ease;
    }
    nav a:hover { color: orange; }

    /* ---------- 语言按钮（放在header右侧） ---------- */
    .lang-box {
      position: relative;
      display: inline-block;
    }

    .lang-btn {
      background-color: #0b1b33;
      color: orange;
      padding: 8px 18px;
      border: 1px solid orange;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .lang-btn:hover {
      background-color: rgba(255, 165, 0, 0.1);
      transform: scale(1.05);
    }

    .lang-list-container {
      display: none;
      position: absolute;
      right: 0;
      background-color: #102542;
      width: 280px;
      max-height: 500px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      overflow: hidden;
      margin-top: 6px;
      z-index: 10;
    }

    .lang-list-container.show {
      display: flex;
      flex-direction: column;
    }

    .lang-search-container {
      padding: 12px;
      background-color: #0b1b33;
      border-bottom: 1px solid rgba(255,165,0,0.3);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .lang-search {
      width: 100%;
      padding: 8px 12px;
      background-color: #0a1529;
      border: 1px solid rgba(255,165,0,0.3);
      border-radius: 6px;
      color: white;
      font-size: 13px;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    .lang-search:focus {
      outline: none;
      border-color: orange;
      box-shadow: 0 0 5px rgba(255,165,0,0.5);
    }

    .lang-search::placeholder {
      color: #8899bb;
    }

    .lang-list {
      flex: 1;
      max-height: 400px;
      overflow-y: auto;
      padding: 5px 0;
    }

    .lang-list::-webkit-scrollbar {
      width: 6px;
    }

    .lang-list::-webkit-scrollbar-track {
      background: #0b1b33;
    }

    .lang-list::-webkit-scrollbar-thumb {
      background: orange;
      border-radius: 3px;
    }

    .lang-list a {
      padding: 10px 15px;
      display: block;
      color: white;
      text-decoration: none;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .lang-list a:hover {
      background-color: #1a335c;
      color: orange;
      padding-left: 20px;
    }

    .lang-divider {
      height: 1px;
      background: rgba(255,165,0,0.3);
      margin: 8px 15px;
    }

    .lang-section-title {
      padding: 8px 15px;
      font-size: 11px;
      color: #8899bb;
      text-transform: uppercase;
      letter-spacing: 1px;
      background-color: #0a1529;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    /* ---------- Hero Section ---------- */
    .hero {
      height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      background: linear-gradient(to bottom right, #0c1c36, #132d52);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,165,0,0.2) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      border-radius: 50%;
      animation: glow 6s infinite alternate ease-in-out;
    }

    @keyframes glow {
      from { transform: scale(1); opacity: 0.6; }
      to   { transform: scale(1.2); opacity: 1; }
    }

    .hero h1 {
      font-size: 3rem;
      color: orange;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 0;
      opacity: 0;
      animation: fadeIn 2s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hero-line {
      width: 80px;
      height: 3px;
      background: orange;
      margin: 25px 0;
      border-radius: 2px;
      animation: lineGrow 1.5s ease-out;
    }

    @keyframes lineGrow {
      from { width: 0; opacity: 0; }
      to   { width: 80px; opacity: 1; }
    }

    .hero p {
      font-size: 1.2rem;
      color: #cfd7e6;
      max-width: 600px;
      margin: 10px auto 30px;
      line-height: 1.7;
      opacity: 0;
      animation: fadeIn 2s 1s forwards;
    }

    .btn {
      display: inline-block;
      padding: 12px 32px;
      border: 2px solid orange;
      border-radius: 30px;
      color: orange;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255,165,0,0.4);
      opacity: 0;
      animation: fadeIn 2s 1.5s forwards;
    }

    .btn:hover {
      background: orange;
      color: #0c1c36;
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255,165,0,0.6);
    }

    footer {
      text-align: center;
      padding: 25px;
      background-color: #0b1b33;
      border-top: 2px solid rgba(255,165,0,0.4);
      font-size: 0.9rem;
      color: #cfd7e6;
    }

    .fb-link {
      color: orange;
      text-decoration: none;
      margin-left: 10px;
      transition: 0.3s;
    }
    .fb-link:hover { color: white; }

    /* 响应式设计 */
    @media (max-width: 768px) {
      header {
        padding: 15px 20px;
        flex-direction: column;
        gap: 15px;
      }

      .header-left {
        width: 100%;
        justify-content: space-between;
      }

      .logo-text {
        font-size: 1.4rem;
      }

      nav {
        min-width: 80px;
      }

      .lang-box {
        align-self: flex-end;
      }

      .lang-list-container {
        width: 250px;
        right: -10px;
      }

      .hero h1 {
        font-size: 2.2rem;
      }
    }
  </style>
</head>

    // 生成语言列表
    function generateLangList() {
      langList.innerHTML = '';
      
      Object.entries(languageGroups).forEach(([groupName, languages]) => {
        // 添加分组标题
        const title = document.createElement('div');
        title.className = 'lang-section-title';
        title.textContent = groupName;
        title.setAttribute('data-group', groupName);
        langList.appendChild(title);
        
        // 添加语言项
        languages.forEach(lang => {
          const langItem = document.createElement('a');
          langItem.innerHTML = `${lang.native}`;
          langItem.setAttribute('data-lang-code', lang.code);
          langItem.onclick = (e) => {
            e.preventDefault();
            switchLang(lang.code);
          };
          langList.appendChild(langItem);
        });
        
        // 添加分隔线（除了最后一个分组）
        if (groupName !== Object.keys(languageGroups)[Object.keys(languageGroups).length - 1]) {
          const divider = document.createElement('div');
          divider.className = 'lang-divider';
          langList.appendChild(divider);
        }
      });
    }

    // 初始化页面语言
    document.addEventListener('DOMContentLoaded', function() {
      const savedLang = getSavedLanguage();
      applyLanguage(savedLang);
      generateLangList();
    });

    // 获取保存的语言
    function getSavedLanguage() {
      return localStorage.getItem(LANG_STORAGE_KEY) || 'en';
    }

    // 保存语言选择
    function saveLanguage(lang) {
      localStorage.setItem(LANG_STORAGE_KEY, lang);
    }

    // 应用语言
    async function applyLanguage(lang) {
      try {
        const res = await fetch(`lang/${lang}.json`);
        const data = await res.json();

        document.querySelectorAll("[data-lang-key]").forEach(el => {
          const key = el.getAttribute("data-lang-key");
          if (data[key]) el.textContent = data[key];
        });

        updateLangButton(lang);

      } catch(err) {
        console.error("语言加载失败:", err);
        if (lang !== 'en') {
          applyLanguage('en');
        }
      }
    }

    // 更新语言按钮显示
    function updateLangButton(lang) {
      let displayName = 'Language';
      Object.values(languageGroups).forEach(group => {
        group.forEach(l => {
          if (l.code === lang) {
            displayName = l.native;
          }
        });
      });
      
      langBtn.innerHTML = `🌐 ${displayName}`;
    }

    // 切换语言
    async function switchLang(lang) {
      saveLanguage(lang);
      await applyLanguage(lang);
      langContainer.classList.remove('show');
    }

    // 切换语言菜单显示/隐藏
    function toggleLangMenu() {
      langContainer.classList.toggle('show');
      if (langContainer.classList.contains('show')) {
        langSearch.value = '';
        resetSearch();
      }
    }

    // 搜索功能
    langSearch.addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase().trim();
      
      if (searchTerm === '') {
        resetSearch();
        return;
      }

      const langItems = langList.querySelectorAll('a');
      const sectionTitles = langList.querySelectorAll('.lang-section-title');
      let hasAnyResults = false;

      // 先隐藏所有
      langItems.forEach(item => item.style.display = 'none');
      sectionTitles.forEach(title => title.style.display = 'none');

      // 显示匹配的项目
      langItems.forEach(item => {
        const text = item.textContent.toLowerCase();
        if (text.includes(searchTerm)) {
          item.style.display = 'block';
          hasAnyResults = true;
          
          // 显示对应的分组标题
          const groupTitle = item.previousElementSibling;
          if (groupTitle && groupTitle.classList.contains('lang-section-title')) {
            groupTitle.style.display = 'block';
          }
        }
      });

      // 如果没有结果，显示提示
      if (!hasAnyResults) {
        const noResults = document.createElement('div');
        noResults.style.padding = '20px';
        noResults.style.textAlign = 'center';
        noResults.style.color = '#8899bb';
        noResults.textContent = 'No languages found';
        langList.appendChild(noResults);
      }
    });

    // 重置搜索显示所有语言
    function resetSearch() {
      const allItems = langList.querySelectorAll('*');
      allItems.forEach(item => {
        item.style.display = '';
      });
      
      // 移除"没有结果"的提示
      const noResults = langList.querySelector('div[style*="text-align: center"]');
      if (noResults) {
        noResults.remove();
      }
    }

    // 事件监听器
    langBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleLangMenu();
    });

    // 点击页面其他地方关闭语言选择框
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.lang-box')) {
        langContainer.classList.remove('show');
      }
    });

    // 阻止语言选择框内的点击事件冒泡
    langContainer.addEventListener('click', function(e) {
      e.stopPropagation();
    });
  </script>
