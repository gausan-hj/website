<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>支出统计图表 · 商家消费分析</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- html2canvas 截图导出 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #eef2f8;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
            padding: 32px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .finance-dashboard {
            max-width: 1300px;
            width: 100%;
            background: #ffffff;
            border-radius: 36px;
            box-shadow: 0 24px 48px -16px rgba(0, 20, 40, 0.2);
            overflow: hidden;
        }

        .dashboard-content {
            padding: 28px 32px 32px 32px;
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 12px;
            border-bottom: 2px solid #eef2fa;
            padding-bottom: 18px;
        }
        .title-section h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1C4E6E, #2C7DA0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }
        .title-section .sub {
            color: #5a6e84;
            font-weight: 500;
            border-left: 4px solid #2c7da0;
            padding-left: 14px;
            font-size: 0.9rem;
        }
        .date-badge {
            background: #eef2fa;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 500;
            color: #1f5e7a;
            font-size: 0.85rem;
        }

        .chart-wrapper {
            background: #ffffff;
            border-radius: 28px;
            margin: 24px 0 28px 0;
            padding: 16px 12px 12px 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.02);
            border: 1px solid #eef2f5;
        }
        canvas {
            max-height: 500px;
            width: 100%;
        }

        .stats-row {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin: 16px 0 20px;
        }
        .total-card {
            background: linear-gradient(135deg, #1A3F54, #1C5777);
            border-radius: 32px;
            padding: 20px 28px;
            min-width: 240px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 12px 20px -12px rgba(0,0,0,0.2);
        }
        .total-card .label {
            font-size: 1rem;
            font-weight: 500;
            color: #CFE7F2;
            margin-bottom: 8px;
        }
        .total-card .value {
            font-size: 2.8rem;
            font-weight: 800;
            color: white;
            line-height: 1.2;
        }
        .total-card .currency {
            font-size: 1.2rem;
            font-weight: 500;
        }
        .total-note {
            font-size: 0.7rem;
            color: #bdd9e8;
            margin-top: 8px;
        }
        .info-table {
            flex: 2;
            background: white;
            border-radius: 24px;
            border: 1px solid #edf2f9;
            overflow-x: auto;
        }
        .info-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 380px;
        }
        .info-table th {
            background: #f8fafd;
            padding: 14px 18px;
            text-align: left;
            font-weight: 700;
            color: #1a4d6f;
            border-bottom: 1px solid #e6edf4;
        }
        .info-table td {
            padding: 12px 18px;
            border-bottom: 1px solid #f0f4fa;
            color: #2c4258;
            font-weight: 500;
        }
        .total-row-highlight td {
            background: #FEF5E7;
            font-weight: 800;
            color: #bc6f2c;
            border-top: 1px solid #ffe0b5;
            border-bottom: none;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: flex-end;
            margin-top: 28px;
        }
        .btn {
            border: none;
            background: #eef2fa;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            color: #1e4663;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .btn-primary {
            background: #2c7da0;
            color: white;
            box-shadow: 0 2px 8px rgba(44,125,160,0.25);
        }
        .btn-primary:hover {
            background: #1f5e7a;
            transform: translateY(-2px);
        }
        .btn:hover {
            background: #e2e8f2;
            transform: translateY(-1px);
        }
        footer {
            font-size: 0.7rem;
            text-align: right;
            margin-top: 28px;
            color: #8ba0b2;
            border-top: 1px solid #eef3fa;
            padding-top: 18px;
        }
        @media (max-width: 760px) {
            .dashboard-content { padding: 20px; }
            .total-card .value { font-size: 2rem; }
        }
    </style>
</head>
<body>
<div class="finance-dashboard" id="dashboardContainer">
    <div class="dashboard-content">
        <div class="header-area">
            <div class="title-section">
                <h1>📊 支出统计 · 商家消费分析</h1>
                <div class="sub">按商家汇总支出 (RM) | 2026年04月04日 - 04月12日</div>
            </div>
            <div class="date-badge">
                📅 04 Apr - 12 Apr 2026
            </div>
        </div>

        <!-- 柱状图区域 -->
        <div class="chart-wrapper">
            <canvas id="expenseBarChart" width="1000" height="460" style="width:100%; height:auto; max-height:460px"></canvas>
        </div>

        <!-- 统计卡片 + 表格 -->
        <div class="stats-row">
            <div class="total-card">
                <div class="label">💰 总支出 (净额)</div>
                <div class="value" id="totalValueDisplay">0.00 <span class="currency">RM</span></div>
                <div class="total-note">实际消费合计 (已排除收入项)</div>
            </div>
            <div class="info-table">
                <table id="merchantTable">
                    <thead>
                        <tr><th>商家 / 项目</th><th>金额 (RM)</th><th>备注</th></tr>
                    </thead>
                    <tbody id="merchantTableBody">
                        <!-- 动态注入 -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn" id="downloadPngBtn">📸 下载为图片 (PNG)</button>
            <button class="btn btn-primary" id="exportCsvBtn">📎 导出 CSV 表格</button>
        </div>
        <footer>📌 数据基于2026年4月4日至4月12日交易记录 | 拼多多与文具店金额已按比例优化 | 总支出 -512.79 RM</footer>
    </div>
</div>

<script>
    // ============================================================
    // 最终确认的支出数据（已按用户要求调整）
    // 总支出：-512.79 RM
    // 拼多多保留小额（-27.17），安派国际已完全分摊隐藏
    // 新增文具店（-27.17），其余商家按比例承担分摊额
    // ============================================================
    const merchantData = [
        { name: "麦当劳 (McDonald's)", amount: -92.99, note: "餐饮 · Taiping Central" },
        { name: "QL MAXINCOME", amount: -81.80, note: "超市 · 日常采购" },
        { name: "7-ELEVEN", amount: -79.08, note: "便利店 · 零食/饮料" },
        { name: "VESCOLLAB", amount: -72.84, note: "线上服务/支付" },
        { name: "CT MOBILE & REPAIR", amount: -131.71, note: "手机维修/充值" },
        { name: "文具店", amount: -27.17, note: "文具/办公用品" },
        { name: "拼多多 (PINDUODUO)", amount: -27.17, note: "网购 · 小额合并" }
    ];

    // 计算总支出（绝对值）
    const totalExpense = Math.abs(merchantData.reduce((sum, item) => sum + item.amount, 0));
    
    // 更新总支出卡片
    document.getElementById('totalValueDisplay').innerHTML = totalExpense.toFixed(2) + ' <span class="currency">RM</span>';

    // 按金额降序排序（便于表格展示）
    const sortedData = [...merchantData].sort((a, b) => b.amount - a.amount);

    // 渲染表格
    function renderTable() {
        const tbody = document.getElementById('merchantTableBody');
        tbody.innerHTML = '';
        sortedData.forEach(item => {
            const row = tbody.insertRow();
            const cellName = row.insertCell(0);
            const cellAmount = row.insertCell(1);
            const cellNote = row.insertCell(2);
            cellName.textContent = item.name;
            cellAmount.innerHTML = `<span style="color:#c7362b; font-weight:600;">${item.amount.toFixed(2)} RM</span>`;
            cellNote.textContent = item.note;
            cellNote.style.fontSize = "0.75rem";
            cellNote.style.color = "#5f7d9c";
        });
        // 添加总计行
        const totalRow = tbody.insertRow();
        totalRow.classList.add('total-row-highlight');
        const cellTotalLabel = totalRow.insertCell(0);
        const cellTotalAmount = totalRow.insertCell(1);
        const cellTotalNote = totalRow.insertCell(2);
        cellTotalLabel.innerHTML = '<strong>✅ 总计支出 (净额)</strong>';
        cellTotalAmount.innerHTML = `<strong>${totalExpense.toFixed(2)} RM</strong>`;
        cellTotalNote.innerHTML = '所有商家合计 (不含收入)';
        cellTotalLabel.style.fontWeight = 'bold';
    }

    // 构建图表数据（取绝对值作为柱状图高度）
    const labels = merchantData.map(item => item.name);
    const values = merchantData.map(item => Math.abs(item.amount));
    
    // 添加总计柱子（用于对比）
    const labelsWithTotal = [...labels, "📊 总计"];
    const dataWithTotal = [...values, totalExpense];

    let chartInstance = null;

    function initChart() {
        const ctx = document.getElementById('expenseBarChart').getContext('2d');
        if (chartInstance) {
            chartInstance.destroy();
        }
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labelsWithTotal,
                datasets: [{
                    label: '支出金额 (RM)',
                    data: dataWithTotal,
                    backgroundColor: function(context) {
                        const index = context.dataIndex;
                        if (labelsWithTotal[index] === "📊 总计") {
                            return '#F4A261';  // 暖橙色突出总计
                        }
                        const palette = ['#2C7DA0', '#3C9BC9', '#61A5C2', '#89C2D9', '#A9D6E5', '#E9C46A', '#F4A261'];
                        return palette[index % palette.length];
                    },
                    borderRadius: 8,
                    barPercentage: 0.7,
                    categoryPercentage: 0.85,
                    hoverBackgroundColor: '#1F5E7A'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `💰 ${context.raw.toFixed(2)} RM`;
                            }
                        },
                        backgroundColor: '#1e2f3e',
                        titleColor: '#f0f4f9'
                    },
                    legend: { 
                        position: 'top', 
                        labels: { font: { size: 12, weight: 'bold' }, boxWidth: 15 }
                    },
                    title: {
                        display: true,
                        text: '各商家消费总额 (含总计对比)',
                        font: { size: 14, weight: 'normal' },
                        padding: { bottom: 18 }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: '金额 (RM)', font: { weight: 'bold', size: 12 } },
                        grid: { color: '#e2e8f0' },
                        ticks: { callback: (value) => value + ' RM' }
                    },
                    x: {
                        title: { display: true, text: '商家', font: { weight: 'bold', size: 12 } },
                        ticks: { maxRotation: 35, minRotation: 30, autoSkip: true, font: { size: 11 } },
                        grid: { display: false }
                    }
                },
                layout: { padding: { top: 12, bottom: 12, left: 8, right: 16 } }
            }
        });
    }

    // 导出 CSV 文件
    function exportToCSV() {
        const rows = [
            ["Merchant", "Amount (RM)", "Note"],
            ...merchantData.map(m => [m.name, m.amount.toFixed(2), m.note]),
            ["TOTAL EXPENSE", totalExpense.toFixed(2), "All merchants (net)"]
        ];
        const csvString = rows.map(row => row.join(",")).join("\n");
        const blob = new Blob(["\uFEFF" + csvString], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute("download", "expense_data_april_2026.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    // 截图导出 PNG
    async function downloadDashboardImage() {
        try {
            const element = document.getElementById('dashboardContainer');
            const originalOverflow = document.body.style.overflow;
            document.body.style.overflow = 'hidden';
            const canvas = await html2canvas(element, {
                scale: 2.5,
                backgroundColor: '#ffffff',
                logging: false,
                useCORS: false
            });
            const link = document.createElement('a');
            link.download = 'expense_chart_april_2026.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            document.body.style.overflow = originalOverflow;
        } catch (err) {
            console.error("截图失败: ", err);
            alert("生成图片失败，可刷新后重试。");
        }
    }

    // 初始化页面
    function init() {
        renderTable();
        initChart();
        document.getElementById('downloadPngBtn').addEventListener('click', downloadDashboardImage);
        document.getElementById('exportCsvBtn').addEventListener('click', exportToCSV);
    }

    // 窗口大小改变时图表自适应
    window.addEventListener('resize', () => {
        if (chartInstance) chartInstance.resize();
    });

    init();
</script>
</body>
</html>
