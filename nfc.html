<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC打卡 · 深蓝橙 · 灵动版</title>
    <!-- 引入 SheetJS 用于导出 Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0a1c2c 0%, #123a4d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            width: 100%;
            height: 90vh;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 24px;
        }

        /* ========= 左侧主打卡区 ========= */
        .left-panel {
            background: #ffffff0a;
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 32px;
            border: 2px solid #ff8c1a;
            box-shadow: 0 30px 50px -15px #00000080, inset 0 0 30px #ff8c1a20;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部状态栏 */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 2px solid #ff8c1a40;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: #0a1f2e;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #ff8c1a;
            border: 2px solid #ff8c1a;
            box-shadow: 0 0 15px #ff8c1a;
        }

        .logo-text h2 {
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .logo-text p {
            color: #ffb05c;
            font-size: 0.8rem;
        }

        .connection {
            background: #0f2a3a;
            border-radius: 40px;
            padding: 8px 20px;
            border: 1px solid #ff8c1a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background: #4caf50;
            border-radius: 50%;
            box-shadow: 0 0 12px #8bc34a;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        .connection span {
            color: #ffdbad;
            font-weight: 500;
            font-size: 0.9rem;
        }

        /* 中央打卡区 */
        .punch-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .nfc-ring {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #ff8c1a;
            box-shadow: 0 0 30px #ff8c1a80, inset 0 0 30px #ff8c1a40;
            animation: rotate 8s linear infinite;
        }

        .inner-ring {
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 2px dashed #ff8c1a;
            animation: rotateReverse 6s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotateReverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        .core {
            width: 160px;
            height: 160px;
            background: #0f2a3a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #ff8c1a;
            box-shadow: 0 0 40px #ff8c1a;
            z-index: 2;
            transition: all 0.2s;
        }

        .core span {
            font-size: 3.5rem;
            filter: drop-shadow(0 0 10px #f90);
        }

        /* 对勾动画容器 */
        .check-animation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .check-animation.show {
            opacity: 1;
        }

        .check-svg {
            width: 100%;
            height: 100%;
        }

        .check-circle {
            stroke: #ff8c1a;
            stroke-width: 4;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            fill: none;
            animation: draw 0.6s ease forwards;
        }

        .check-path {
            stroke: #ff8c1a;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            fill: none;
            animation: draw 0.4s 0.3s ease forwards;
        }

        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        /* 员工信息卡片（打卡后浮现） */
        .employee-card {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -20%);
            width: 300px;
            background: #112f40;
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 24px;
            border: 2px solid #ff8c1a;
            box-shadow: 0 30px 40px -15px black;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: white;
        }

        .employee-card.show {
            opacity: 1;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            background: #ff8c1a;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #0a1f2e;
        }

        .info h3 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .info p {
            color: #ffc285;
            font-size: 0.9rem;
        }

        .details {
            background: #0a202e;
            border-radius: 28px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-item .label {
            color: #a0c6d9;
            font-size: 0.75rem;
        }

        .detail-item .value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffc285;
        }

        .badge {
            background: #ff8c1a;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            color: #02131e;
        }

        /* 底部状态与测试按钮 */
        .bottom-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f2635;
            border-radius: 60px;
            padding: 8px 16px 8px 24px;
            border: 1px solid #ff8c1a;
            margin-top: 20px;
        }

        .status-message {
            color: #ffc891;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .test-btn {
            background: #ff8c1a;
            border: none;
            color: #02131e;
            font-weight: 700;
            padding: 12px 30px;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #b15f0a;
            transition: 0.1s;
            border: 2px solid #ffdbb5;
        }

        .test-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b15f0a;
        }

        /* ========= 右侧历史记录区 ========= */
        .right-panel {
            background: #ffffff0a;
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 32px 24px;
            border: 2px solid #ff8c1a;
            box-shadow: 0 30px 50px -15px #00000080;
            display: flex;
            flex-direction: column;
        }

        .right-header {
            margin-bottom: 20px;
        }

        .right-header h2 {
            color: white;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .date-badge {
            display: flex;
            gap: 15px;
            color: #ffc891;
            font-size: 0.9rem;
        }

        .date-badge span {
            background: #1f4055;
            padding: 4px 15px;
            border-radius: 40px;
            border: 1px solid #ff8c1a;
        }

        /* 统计卡片 */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: #0f2635;
            border-radius: 28px;
            padding: 18px;
            border: 1px solid #ff8c1a;
        }

        .stat-label {
            color: #c0d9e8;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .stat-number {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .stat-trend {
            color: #ffae42;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        /* 操作按钮组 */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
        }

        .btn-excel {
            flex: 1;
            background: #ff8c1a;
            border: none;
            color: #02131e;
            font-weight: 600;
            padding: 12px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            border: 2px solid #ffb868;
            transition: 0.2s;
        }

        .btn-excel:hover {
            background: #e67c0f;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px #ff8c1a40;
        }

        .btn-filter {
            background: #1d4055;
            border: 1px solid #ff8c1a;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-filter:hover {
            background: #2b5570;
        }

        /* 记录列表 */
        .records-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .records-list::-webkit-scrollbar {
            width: 5px;
        }

        .records-list::-webkit-scrollbar-track {
            background: #1e3f53;
            border-radius: 10px;
        }

        .records-list::-webkit-scrollbar-thumb {
            background: #ff8c1a;
            border-radius: 10px;
        }

        .record-item {
            background: #0f2a3a;
            border-radius: 24px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #ff8c1a60;
            transition: 0.2s;
            animation: slideIn 0.3s;
        }

        .record-item:hover {
            border-color: #ff8c1a;
            background: #14384b;
            transform: translateX(5px);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .record-avatar {
            width: 48px;
            height: 48px;
            background: #ff8c1a;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #02131e;
            font-weight: 600;
        }

        .record-info {
            flex: 1;
        }

        .record-name {
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 3px;
        }

        .record-meta {
            display: flex;
            gap: 10px;
            color: #b0d4e8;
            font-size: 0.8rem;
        }

        .record-meta span {
            background: #1f4055;
            padding: 2px 10px;
            border-radius: 30px;
        }

        .record-time {
            text-align: right;
        }

        .record-time .date {
            color: #ffae42;
            font-weight: 600;
        }

        .record-time .time {
            color: #a0bed0;
            font-size: 0.7rem;
        }

        /* 飞入目标点 */
        .fly-destination {
            position: absolute;
            top: 100px;
            right: 50px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ff8c1a30;
            border: 2px dashed #ff8c1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff8c1a;
            font-size: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .fly-destination.show {
            opacity: 1;
            animation: bounce 0.6s infinite;
        }

        @keyframes bounce {
            0%,100%{ transform: scale(1); }
            50%{ transform: scale(1.1); }
        }

        .flight-path {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .flight-particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #ff8c1a;
            border-radius: 50%;
            box-shadow: 0 0 20px #f90;
            animation: fly 0.8s ease-out forwards;
        }

        @keyframes fly {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: translate(200px, -100px) scale(0); }
        }
    </style>
</head>
<body>
    <div class="flight-path" id="flightPath"></div>
    <div class="fly-destination" id="flyDest">📥</div>

    <div class="dashboard">
        <!-- 左侧 -->
        <div class="left-panel">
            <div class="status-bar">
                <div class="logo-area">
                    <div class="logo-icon">⚡</div>
                    <div class="logo-text">
                        <h2>NFC TAP</h2>
                        <p>深蓝·橙 灵动版</p>
                    </div>
                </div>
                <div class="connection">
                    <div class="pulse-dot"></div>
                    <span>读卡器在线</span>
                </div>
            </div>

            <div class="punch-area">
                <div class="nfc-ring" id="tapRing">
                    <div class="outer-ring"></div>
                    <div class="inner-ring"></div>
                    <div class="core">
                        <span>📱</span>
                    </div>
                </div>

                <!-- 对勾动画 -->
                <div class="check-animation" id="checkAnim">
                    <svg class="check-svg" viewBox="0 0 52 52">
                        <circle class="check-circle" cx="26" cy="26" r="25" fill="none"/>
                        <path class="check-path" fill="none" d="M14 27l7 7 16-16"/>
                    </svg>
                </div>

                <!-- 信息卡片 -->
                <div class="employee-card" id="empCard">
                    <div class="card-header">
                        <div class="avatar" id="cardAvatar">👤</div>
                        <div class="info">
                            <h3 id="cardName">张明远</h3>
                            <p id="cardDept">研发中心 · 架构组</p>
                        </div>
                    </div>
                    <div class="details">
                        <div class="detail-item">
                            <div class="label">工号</div>
                            <div class="value" id="cardId">HW-2304</div>
                        </div>
                        <div class="detail-item">
                            <div class="label">打卡时间</div>
                            <div class="value" id="cardTime">08:32</div>
                        </div>
                        <span class="badge">已打卡</span>
                    </div>
                </div>
            </div>

            <div class="bottom-actions">
                <div class="status-message" id="statusMsg">
                    <span>⚪</span> 等待触碰NFC...
                </div>
                <button class="test-btn" id="simulateBtn">模拟打卡</button>
            </div>
        </div>

        <!-- 右侧 -->
        <div class="right-panel">
            <div class="right-header">
                <h2>打卡记录</h2>
                <div class="date-badge">
                    <span>📅 2026-03-08 ~ 03-14</span>
                    <span>本月累计 <span id="totalCount">0</span></span>
                </div>
            </div>

            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-label">今日打卡</div>
                    <div class="stat-number" id="todayCount">0</div>
                    <div class="stat-trend">⬆️ 较昨日 +3</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">连续打卡</div>
                    <div class="stat-number" id="streakCount">5</div>
                    <div class="stat-trend">🏆 最高 12天</div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn-excel" id="excelBtn"><span>📊</span> 导出 Excel</button>
                <button class="btn-filter" id="filterBtn"><span>📅</span> 筛选</button>
            </div>

            <div class="records-list" id="recordsList"></div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- 模拟数据 ----------
            const staff = [
                { name: '张明远', dept: '研发中心 · 架构组', id: 'HW-2304', avatar: '👨‍💻' },
                { name: '李思睿', dept: '产品部 · 设计组', id: 'HW-1789', avatar: '👩‍🎨' },
                { name: '王华强', dept: '测试部 · 自动化', id: 'HW-5521', avatar: '👨‍🔧' },
                { name: '赵一鸣', dept: '销售部 · 华东区', id: 'HW-3321', avatar: '👨‍💼' },
                { name: '孙小美', dept: '人事部 · 招聘组', id: 'HW-7788', avatar: '👩‍💼' },
                { name: '陈飞', dept: '研发中心 · 后端', id: 'HW-9912', avatar: '👨‍🏫' }
            ];

            // DOM
            const tapRing = document.getElementById('tapRing');
            const checkAnim = document.getElementById('checkAnim');
            const empCard = document.getElementById('empCard');
            const statusMsg = document.getElementById('statusMsg');
            const flyDest = document.getElementById('flyDest');
            const flightPath = document.getElementById('flightPath');
            const simulateBtn = document.getElementById('simulateBtn');
            const excelBtn = document.getElementById('excelBtn');
            const filterBtn = document.getElementById('filterBtn');
            const recordsList = document.getElementById('recordsList');
            const todayCountSpan = document.getElementById('todayCount');
            const totalCountSpan = document.getElementById('totalCount');
            const streakCountSpan = document.getElementById('streakCount');

            // 卡片元素
            const cardAvatar = document.getElementById('cardAvatar');
            const cardName = document.getElementById('cardName');
            const cardDept = document.getElementById('cardDept');
            const cardId = document.getElementById('cardId');
            const cardTime = document.getElementById('cardTime');

            // 状态变量
            let history = []; // 存储记录 { name, dept, empId, avatar, date, time, displayDate, displayTime }
            let timer1 = null, timer2 = null;

            // 获取当前时间
            function nowDateTime() {
                const d = new Date();
                const year = d.getFullYear();
                const month = (d.getMonth()+1).toString().padStart(2,'0');
                const day = d.getDate().toString().padStart(2,'0');
                const hours = d.getHours().toString().padStart(2,'0');
                const mins = d.getMinutes().toString().padStart(2,'0');
                return {
                    date: `${year}-${month}-${day}`,
                    time: `${hours}:${mins}`,
                    displayDate: `${month}/${day}`,
                    displayTime: `${hours}:${mins}`
                };
            }

            // 添加记录
            function addRecord(employee) {
                const dt = nowDateTime();
                const record = {
                    ...employee,
                    date: dt.date,
                    time: dt.time,
                    displayDate: dt.displayDate,
                    displayTime: dt.displayTime
                };
                history.unshift(record);
                renderList();
                updateStats();
            }

            // 渲染列表
            function renderList() {
                if (history.length === 0) {
                    recordsList.innerHTML = `<div class="record-item" style="opacity:0.7;"><div class="record-avatar">⏳</div><div class="record-info"><div class="record-name">暂无打卡</div><div class="record-meta"><span>--</span></div></div><div class="record-time"><div class="date">--</div><div class="time">--:--</div></div></div>`;
                    return;
                }
                let html = '';
                history.slice(0, 12).forEach(r => {
                    html += `
                        <div class="record-item">
                            <div class="record-avatar">${r.avatar}</div>
                            <div class="record-info">
                                <div class="record-name">${r.name}</div>
                                <div class="record-meta">
                                    <span>${r.dept.split('·')[0].trim()}</span>
                                    <span>${r.id}</span>
                                </div>
                            </div>
                            <div class="record-time">
                                <div class="date">${r.displayDate}</div>
                                <div class="time">${r.displayTime}</div>
                            </div>
                        </div>
                    `;
                });
                recordsList.innerHTML = html;
            }

            // 更新统计数据
            function updateStats() {
                const today = new Date().toISOString().slice(0,10);
                const todayCount = history.filter(r => r.date === today).length;
                document.getElementById('todayCount').textContent = todayCount;
                totalCountSpan.textContent = history.length;
                // 模拟连续打卡 (取历史长度，但不超过7)
                const streak = Math.min(history.length, 7);
                streakCountSpan.textContent = streak || 5;
            }

            // 飞入动画
            function createFlight() {
                const particle = document.createElement('div');
                particle.className = 'flight-particle';
                particle.style.left = '50%';
                particle.style.top = '50%';
                flightPath.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }

            // 打卡成功动画
            function punchSuccess() {
                // 随机选一个员工
                const emp = staff[Math.floor(Math.random() * staff.length)];
                const dt = nowDateTime();

                // 更新卡片内容
                cardAvatar.textContent = emp.avatar;
                cardName.textContent = emp.name;
                cardDept.textContent = emp.dept;
                cardId.textContent = emp.id;
                cardTime.textContent = dt.displayTime;

                // 显示卡片和飞入目标
                empCard.classList.add('show');
                flyDest.classList.add('show');
                statusMsg.innerHTML = `<span>🟢</span> 打卡成功 (${emp.name})`;

                // 清除之前的定时器
                if (timer1) clearTimeout(timer1);
                if (timer2) clearTimeout(timer2);

                timer1 = setTimeout(() => {
                    // 飞入效果
                    createFlight();
                    // 添加记录
                    addRecord(emp);
                    // 隐藏卡片和飞入目标
                    empCard.classList.remove('show');
                    flyDest.classList.remove('show');

                    // 显示对勾
                    checkAnim.classList.add('show');
                    // 重置对勾动画 (通过重新克隆)
                    const svg = checkAnim.querySelector('svg');
                    const newSvg = svg.cloneNode(true);
                    checkAnim.replaceChild(newSvg, svg);

                    timer2 = setTimeout(() => {
                        checkAnim.classList.remove('show');
                        statusMsg.innerHTML = `<span>⚪</span> 等待触碰NFC...`;
                    }, 1200);
                }, 1500);
            }

            // 模拟NFC检测 (实际浏览器NFC API需HTTPS且Android)
            if ('NDEFReader' in window) {
                try {
                    const reader = new NDEFReader();
                    reader.addEventListener('reading', () => punchSuccess());
                    reader.scan().catch(() => {}); // 静默失败，依靠模拟按钮
                } catch (e) {}
            }

            // 事件绑定
            tapRing.addEventListener('click', punchSuccess);
            simulateBtn.addEventListener('click', punchSuccess);

            excelBtn.addEventListener('click', () => {
                // 使用SheetJS导出Excel
                let data = [['日期', '时间', '姓名', '部门', '工号']];
                history.forEach(r => {
                    data.push([r.date, r.time, r.name, r.dept, r.id]);
                });
                if (history.length === 0) data.push(['暂无记录', '', '', '', '']);
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(data);
                ws['!cols'] = [{wch:12}, {wch:8}, {wch:12}, {wch:22}, {wch:12}];
                XLSX.utils.book_append_sheet(wb, ws, '打卡记录');
                XLSX.writeFile(wb, `打卡记录_${new Date().toISOString().slice(0,10)}.xlsx`);
            });

            filterBtn.addEventListener('click', () => alert('筛选面板演示 · 可按日期、部门筛选'));

            // 初始化几条示例记录
            setTimeout(() => {
                if (history.length === 0) {
                    addRecord(staff[0]);
                    setTimeout(() => addRecord(staff[1]), 200);
                    setTimeout(() => addRecord(staff[2]), 400);
                }
            }, 500);

            // 清理定时器
            window.addEventListener('beforeunload', () => {
                if (timer1) clearTimeout(timer1);
                if (timer2) clearTimeout(timer2);
            });
        })();
    </script>
</body>
</html>
