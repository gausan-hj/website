<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC打卡 · 双栏深蓝橙</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0a1c2c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 主容器：双栏布局 */
        .dashboard {
            max-width: 1400px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.1fr 1.9fr;
            gap: 24px;
            background: rgba(2, 22, 35, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 24px;
            box-shadow: 0 30px 50px -20px #000000cc, 0 0 0 2px #ff8c1a inset;
        }

        /* ---------- 左侧主打卡区 (深蓝底 + 橙点缀) ---------- */
        .left-panel {
            background: #0b2637;
            border-radius: 36px;
            padding: 28px 20px 32px 20px;
            box-shadow: inset 0 -4px 10px #00000055, 0 10px 20px -5px #010e17;
            border: 2px solid #ff8c1a;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 顶部状态栏：Logo + 连接状态 */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding: 0 8px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            background: #ff8c1a;
            width: 44px;
            height: 44px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 28px;
            color: #02131e;
            box-shadow: 0 0 0 3px #ffb768, 0 0 0 6px #0b3a4e;
        }
        .logo-text {
            color: white;
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-shadow: 0 3px 0 #0e4b6b;
        }
        .connection-status {
            background: #102f40;
            border-radius: 60px;
            padding: 8px 18px;
            border: 1px solid #ff8c1a;
            color: #ffcd94;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #5aff77;
            box-shadow: 0 0 12px #00ff88;
        }
        .dot.offline {
            background: #a0a0a0;
            box-shadow: none;
        }

        /* 中央打卡区 — NFC大圆圈 绝对焦点 */
        .nfc-circle-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px 0 20px 0;
        }
        .nfc-ring {
            width: 260px;
            height: 260px;
            background: radial-gradient(circle at 30% 30%, #1f5575, #072汖);
            background: #0d3347;
            border-radius: 50%;
            box-shadow: 0 0 0 8px #ff8c1a66, 0 0 0 15px #ff8c1a33, 0 20px 30px -5px black, inset 0 -10px 20px #00000099, inset 0 10px 25px #ffb44a55;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.12s;
            border: 3px solid #ffad4d;
        }
        .nfc-ring:active {
            transform: scale(0.97);
            box-shadow: 0 0 0 8px #ffaa33, 0 0 0 15px #ff8c1a66, 0 10px 20px black;
        }
        .nfc-inner {
            width: 190px;
            height: 190px;
            background: #0a1f2e;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px dashed #ffa53b;
            color: white;
            box-shadow: inset 0 0 30px #000000;
        }
        .nfc-icon {
            font-size: 4rem;
            filter: drop-shadow(0 0 10px #f90);
            line-height: 1;
            margin-bottom: 8px;
        }
        .nfc-inner span {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffc285;
            letter-spacing: 3px;
        }

        /* 底部状态文字 + 测试按钮 */
        .footer-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0b2739;
            border-radius: 100px;
            padding: 10px 16px 10px 24px;
            border: 1px solid #ff8c1a;
            margin-top: 25px;
        }
        .status-message {
            color: #ffc891;
            font-weight: 500;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .test-btn {
            background: #ff8c1a;
            border: none;
            color: #02131e;
            font-weight: 800;
            font-size: 1.2rem;
            padding: 10px 24px;
            border-radius: 40px;
            box-shadow: 0 5px 0 #ad5e0b, 0 8px 15px black;
            cursor: pointer;
            transition: 0.08s linear;
            border: 2px solid #ffdbb5;
            letter-spacing: 1px;
        }
        .test-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #ad5e0b, 0 8px 15px black;
        }

        /* ---------- 右侧历史记录区 (深蓝/橙) ---------- */
        .right-panel {
            background: #0c2433;
            border-radius: 36px;
            padding: 28px 24px;
            border: 2px solid #ff8c1a;
            box-shadow: inset 0 -2px 8px #00000040, 0 10px 20px -5px #041018;
            display: flex;
            flex-direction: column;
        }

        /* 顶部标题行 */
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .title-section h2 {
            color: white;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .title-section .date-range {
            color: #ffb062;
            font-weight: 500;
            font-size: 0.9rem;
            background: #1c4055;
            padding: 4px 12px;
            border-radius: 40px;
            border: 1px solid #ff8c1a;
            display: inline-block;
        }
        .action-btns {
            display: flex;
            gap: 12px;
        }
        .excel-btn, .filter-btn {
            background: #123b4f;
            border: 2px solid #ff8c1a;
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 3px 0 #02131e;
        }
        .excel-btn:active, .filter-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        .excel-btn {
            background: #ff8c1a;
            color: #02131e;
            border-color: #ffc891;
            font-weight: 700;
        }

        /* 统计卡片 */
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: #0d2b3c;
            border-radius: 28px;
            padding: 20px 18px;
            border: 1px solid #ff8c1a;
            box-shadow: inset 0 -3px 8px #00000033;
        }
        .stat-label {
            color: #ffc180;
            font-weight: 500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .stat-number {
            color: white;
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1;
        }
        .stat-sub {
            color: #b0d4ec;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* 记录列表 */
        .records-title {
            display: flex;
            justify-content: space-between;
            color: #ffc180;
            margin: 20px 0 12px 0;
            font-weight: 600;
            padding: 0 8px;
        }
        .record-list {
            list-style: none;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 6px;
        }
        .record-item {
            background: #0a212f;
            border-radius: 50px;
            padding: 12px 18px;
            margin-bottom: 10px;
            border: 1px solid #ff8c1a60;
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
            transition: 0.1s;
        }
        .record-item:hover {
            border-color: #ff8c1a;
            background: #0f3144;
        }
        .avatar {
            width: 48px;
            height: 48px;
            background: #ff8c1a;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: #02131e;
            box-shadow: 0 0 0 2px #ffc891;
        }
        .emp-info {
            flex: 2;
        }
        .emp-name {
            font-weight: 700;
            font-size: 1.2rem;
        }
        .emp-dept {
            font-size: 0.85rem;
            color: #ffc891cc;
        }
        .emp-id {
            flex: 1;
            color: #cfecff;
            font-family: monospace;
            font-weight: 600;
        }
        .time-badge {
            background: #ff8c1a30;
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid #ff8c1a;
            font-weight: 600;
            color: #ffe2b3;
            font-size: 0.9rem;
        }

        /* scroll */
        .record-list::-webkit-scrollbar {
            width: 5px;
        }
        .record-list::-webkit-scrollbar-track {
            background: #032汖;
            background: #1b4053;
        }
        .record-list::-webkit-scrollbar-thumb {
            background: #ff8c1a;
            border-radius: 20px;
        }

        /* 点缀 */
        .footer-note {
            color: #ffbb66aa;
            font-size: 0.7rem;
            text-align: right;
            margin-top: 12px;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- 左侧主打卡区 -->
    <div class="left-panel">
        <!-- 顶部状态栏：Logo + 连接状态 -->
        <div class="status-bar">
            <div class="logo-area">
                <div class="logo-icon">⚡</div>
                <span class="logo-text">NFC</span>
            </div>
            <div class="connection-status">
                <span class="dot"></span>
                <span>读卡器已连接</span>
            </div>
        </div>

        <!-- 中央打卡区：NFC圆圈 -->
        <div class="nfc-circle-container">
            <div class="nfc-ring" id="tapCircle">
                <div class="nfc-inner">
                    <div class="nfc-icon">📱</div>
                    <span>NFC</span>
                </div>
            </div>
        </div>

        <!-- 底部：状态文字 + 测试按钮 -->
        <div class="footer-actions">
            <div class="status-message" id="statusMessage">
                <span>🟠</span> 等待打卡... 
            </div>
            <button class="test-btn" id="testSimulateBtn">测试打卡</button>
        </div>
    </div>

    <!-- 右侧历史记录区 -->
    <div class="right-panel">
        <!-- 顶部标题 + 日期范围 + 操作按钮 -->
        <div class="history-header">
            <div class="title-section">
                <h2>📋 打卡记录</h2>
                <span class="date-range">2026-03-08 ~ 2026-03-14</span>
            </div>
            <div class="action-btns">
                <button class="excel-btn" id="exportBtn">📥 Excel 导出</button>
                <button class="filter-btn" id="filterBtn">📅 筛选</button>
            </div>
        </div>

        <!-- 统计卡片：今日打卡、连续打卡 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-label"><span>✅</span> 今日打卡</div>
                <div class="stat-number" id="todayCount">24</div>
                <div class="stat-sub">已打卡 / 总员工 32</div>
            </div>
            <div class="stat-card">
                <div class="stat-label"><span>🔥</span> 连续打卡</div>
                <div class="stat-number" id="streakCount">15</div>
                <div class="stat-sub">最高记录 21 天</div>
            </div>
        </div>

        <!-- 记录列表：带有人名、部门、工号、时间 -->
        <div class="records-title">
            <span>👥 今日打卡明细</span>
            <span>⏱️ 时间</span>
        </div>
        <ul class="record-list" id="recordList">
            <!-- 动态JS生成示例，同时保留静态备用 -->
        </ul>
        <div class="footer-note">深蓝·橙 NFC 双栏版</div>
    </div>
</div>

<script>
    (function() {
        // 模拟数据 — 部门、工号、打卡时间
        const employees = [
            { name: '张明', dept: '研发部', empId: 'NV1001', avatarColor: '#ff8c1a' },
            { name: '李丽', dept: '市场部', empId: 'NV2034', avatarColor: '#ff9f3d' },
            { name: '王强', dept: '产品部', empId: 'NV0872', avatarColor: '#ffb45e' },
            { name: '赵岩', dept: '研发部', empId: 'NV1198', avatarColor: '#ffa042' },
            { name: '陈静', dept: '人事部', empId: 'NV3321', avatarColor: '#ff8c1a' },
            { name: '刘阳', dept: '销售部', empId: 'NV4509', avatarColor: '#ffaa4d' }
        ];

        // 生成随机打卡时间 (今日)
        function randomTime() {
            const hour = Math.floor(Math.random() * 11) + 8; // 8~18点
            const minute = String(Math.floor(Math.random() * 60)).padStart(2,'0');
            return `${hour}:${minute}`;
        }

        // 构建列表HTML
        const recordList = document.getElementById('recordList');
        function renderRecords() {
            let htmlStr = '';
            employees.forEach(emp => {
                const time = randomTime();
                // 取首字作为头像文字
                const initial = emp.name.charAt(0);
                htmlStr += `
                    <li class="record-item">
                        <div class="avatar" style="background:${emp.avatarColor};">${initial}</div>
                        <div class="emp-info">
                            <div class="emp-name">${emp.name}</div>
                            <div class="emp-dept">${emp.dept}</div>
                        </div>
                        <div class="emp-id">${emp.empId}</div>
                        <div class="time-badge">${time}</div>
                    </li>
                `;
            });
            recordList.innerHTML = htmlStr;
        }
        renderRecords();

        // 今日打卡人数 (假设目前有24人，但我们可以让测试按钮增加计数)
        let todayCount = 24;
        const todaySpan = document.getElementById('todayCount');
        const streakSpan = document.getElementById('streakCount');
        // 连续打卡固定模拟
        streakSpan.innerText = '15';

        // 底部状态消息 & 打卡圆圈点击
        const statusMsg = document.getElementById('statusMessage');
        const tapCircle = document.getElementById('tapCircle');
        const testBtn = document.getElementById('testSimulateBtn');

        // 打卡函数：更新状态和今日打卡人数
        function performTap(simulatedName = '张明') {
            // 更改状态文字
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            statusMsg.innerHTML = `<span>🟢</span> 打卡成功 (${simulatedName}) ${timeStr}`;

            // 今日打卡数+1，但不超过总员工 (演示)
            if (todayCount < 32) {
                todayCount += 1;
                todaySpan.innerText = todayCount;
            } else {
                todayCount = 32;
                todaySpan.innerText = todayCount;
            }

            // 在列表最上面新增一条打卡记录 (头像随机采用已有员工)
            const randomEmp = employees[Math.floor(Math.random() * employees.length)];
            const newTime = timeStr;
            const initial = randomEmp.name.charAt(0);
            const newItem = document.createElement('li');
            newItem.className = 'record-item';
            newItem.innerHTML = `
                <div class="avatar" style="background:${randomEmp.avatarColor};">${initial}</div>
                <div class="emp-info">
                    <div class="emp-name">${randomEmp.name}</div>
                    <div class="emp-dept">${randomEmp.dept}</div>
                </div>
                <div class="emp-id">${randomEmp.empId}</div>
                <div class="time-badge">${newTime}</div>
            `;
            recordList.prepend(newItem);
            if (recordList.children.length > 8) {
                recordList.removeChild(recordList.lastElementChild);
            }
        }

        // 绑定圆圈点击 (模拟NFC触碰)
        tapCircle.addEventListener('click', () => {
            performTap('刘阳'); // 随机传个名字
        });

        // 测试按钮模拟
        testBtn.addEventListener('click', () => {
            performTap('赵岩');
        });

        // 导出按钮 / 筛选按钮 模拟提示 (无实际导出)
        document.getElementById('exportBtn').addEventListener('click', () => {
            alert('📁 模拟导出 Excel (深蓝橙风格)');
        });
        document.getElementById('filterBtn').addEventListener('click', () => {
            alert('📆 筛选面板 (演示)');
        });

        // 动态更新时间(装饰) 跟左侧关系不大，但可以显示一下当前日期范围
        // 也可以忽略，已经静态
    })();
</script>

<!-- 确保双栏在任何小屏下自适应 -->
<style>
    @media (max-width: 950px) {
        .dashboard {
            grid-template-columns: 1fr;
        }
    }
</style>
</body>
</html>
