<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFC打卡 · 黑白橙蓝主题</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(0, 0, 0, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(10, 26, 58, 0.02) 0%, transparent 50%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            width: 100%;
            height: 90vh;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 24px;
        }

        /* ===== 左侧主打卡区 - 纯白背景 ===== */
        .left-panel {
            background: #ffffff;
            border-radius: 48px;
            padding: 32px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部状态栏 - 黑白灰 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 2px solid #f5f5f5;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: #000000;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
        }

        .logo-text h2 {
            color: #000000;
            font-size: 1.4rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .logo-text p {
            color: #666666;
            font-size: 0.85rem;
            font-weight: 400;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8f8f8;
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #eeeeee;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #0a1a3a;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .connection-status span {
            color: #333333;
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* 主打卡区域 */
        .main-card-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 500px;
        }

        /* NFC卡片容器 */
        .nfc-card-container {
            position: relative;
            width: 360px;
            height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 主圆圈 - 黑色 */
        .circle-wrapper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 10;
        }

        .hollow-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #000000;
            background: transparent;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.02), 0 20px 40px -10px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: all 0.3s ease;
        }

        .circle-pulse {
            animation: circleScale 2s ease-in-out infinite;
        }

        @keyframes circleScale {
            0%, 100% { 
                transform: scale(1); 
                border-color: #000000;
            }
            50% { 
                transform: scale(1.1); 
                border-color: #ff8c00;
                box-shadow: 0 0 20px rgba(255, 140, 0, 0.3);
            }
        }

        .hollow-circle::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 140, 0, 0.3);
        }

        /* 对勾容器 - 橙色 */
        .check-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .check-container.show {
            opacity: 1;
        }

        .checkmark-svg {
            width: 100px;
            height: 100px;
            filter: drop-shadow(0 4px 8px rgba(255, 140, 0, 0.2));
        }

        .checkmark-circle {
            stroke: #ff8c00;
            stroke-width: 4;
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            fill: none;
            animation: drawCircle 0.5s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark-path {
            stroke: #ff8c00;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            fill: none;
            animation: drawCheck 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.3s forwards;
        }

        @keyframes drawCircle {
            100% { stroke-dashoffset: 0; }
        }

        @keyframes drawCheck {
            100% { stroke-dashoffset: 0; }
        }

        /* 发光圆圈 - 橙色 */
        .glow-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: transparent;
            border: 4px solid #ff8c00;
            box-shadow: 0 0 40px rgba(255, 140, 0, 0.2);
            z-index: 19;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            animation: glowRotate 3s linear infinite;
        }

        .glow-circle.show {
            opacity: 1;
        }

        .glow-circle::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            border-radius: 50%;
            border: 2px dashed rgba(255, 140, 0, 0.3);
        }

        @keyframes glowRotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* 个人资讯卡片 - 纯白 + 黑色文字 */
        .info-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            background: #ffffff;
            border-radius: 40px;
            padding: 28px;
            box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.2);
            border: 1px solid #f0f0f0;
            z-index: 20;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            pointer-events: none;
        }

        .info-card.show {
            opacity: 1;
            pointer-events: auto;
        }

        .info-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .info-avatar {
            width: 80px;
            height: 80px;
            background: #0a1a3a;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: white;
        }

        .info-title h2 {
            color: #000000;
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .info-title p {
            color: #666666;
            font-size: 1rem;
            margin-top: 4px;
        }

        .info-details {
            background: #fafafa;
            border-radius: 28px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #f0f0f0;
        }

        .detail-item {
            text-align: center;
        }

        .detail-label {
            color: #999999;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .detail-value {
            color: #000000;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .badge-orange {
            background: #ff8c00;
            color: white;
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 500;
        }

        /* 状态文字 */
        .status-text {
            margin-top: 30px;
            color: #333333;
            font-size: 1.1rem;
            background: #fafafa;
            padding: 12px 32px;
            border-radius: 60px;
            border: 1px solid #f0f0f0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .status-text.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 测试按钮 - 黑橙 */
        .test-btn {
            margin-top: 20px;
            background: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }

        .test-btn:hover {
            background: #000000;
            color: #ffffff;
        }

        /* ===== 右侧历史记录区 ===== */
        .right-panel {
            background: #ffffff;
            border-radius: 48px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08);
            border: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
        }

        /* 右侧头部 */
        .right-header {
            margin-bottom: 24px;
        }

        .right-header h2 {
            color: #000000;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .date-range {
            color: #666666;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .date-range span {
            background: #f8f8f8;
            padding: 4px 12px;
            border-radius: 20px;
            color: #ff8c00;
            font-weight: 500;
            border: 1px solid #f0f0f0;
        }

        /* 统计卡片 - 黑白 */
        .stats-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #fafafa;
            border-radius: 24px;
            padding: 16px;
            border: 1px solid #f0f0f0;
        }

        .stat-label {
            color: #666666;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .stat-value {
            color: #000000;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .stat-sub {
            color: #ff8c00;
            font-size: 0.8rem;
            margin-top: 4px;
        }

        /* 操作按钮组 */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .excel-btn {
            flex: 1;
            background: #0a1a3a;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
        }

        .excel-btn:hover {
            background: #0f2250;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(10, 26, 58, 0.15);
        }

        .filter-btn {
            background: #ffffff;
            border: 2px solid #000000;
            color: #000000;
            padding: 12px 16px;
            border-radius: 40px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: #000000;
            color: #ffffff;
        }

        /* 历史记录列表 */
        .history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }

        .history-list::-webkit-scrollbar-track {
            background: #f5f5f5;
            border-radius: 10px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: #cccccc;
            border-radius: 10px;
        }

        .history-item {
            background: #fafafa;
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid #f0f0f0;
            transition: all 0.2s;
            animation: slideIn 0.3s ease;
        }

        .history-item:hover {
            border-color: #ff8c00;
            transform: translateX(4px);
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.08);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .history-avatar {
            width: 48px;
            height: 48px;
            background: #0a1a3a;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
        }

        .history-info {
            flex: 1;
        }

        .history-name {
            color: #000000;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .history-meta {
            display: flex;
            gap: 8px;
            color: #666666;
            font-size: 0.8rem;
        }

        .history-meta span {
            background: #ffffff;
            padding: 2px 8px;
            border-radius: 16px;
            border: 1px solid #f0f0f0;
        }

        .history-date {
            text-align: right;
        }

        .history-date .date {
            color: #ff8c00;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .history-date .time {
            color: #999999;
            font-size: 0.75rem;
            margin-top: 2px;
        }

        /* 飞入目标 */
        .fly-target {
            position: absolute;
            top: 100px;
            right: 50px;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            background: rgba(255, 140, 0, 0.08);
            border: 2px dashed #ff8c00;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #ff8c00;
        }

        .fly-target.show {
            opacity: 1;
            animation: targetPulse 0.5s infinite;
        }

        @keyframes targetPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 飞入路径 */
        .flight-path {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .flight-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3px;
            height: 3px;
            background: #ff8c00;
            box-shadow: 0 0 15px #ff8c00;
            border-radius: 50%;
            animation: flyLine 0.8s ease-out forwards;
        }

        @keyframes flyLine {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(calc(50vw + 100px), 100px) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- 飞入路径容器 -->
    <div class="flight-path" id="flightPath"></div>

    <div class="dashboard">
        <!-- 左侧：主打卡区 -->
        <div class="left-panel">
            <!-- 顶部状态栏 -->
            <div class="status-bar">
                <div class="logo-area">
                    <div class="logo-icon">📱</div>
                    <div class="logo-text">
                        <h2>NFC考勤</h2>
                        <p>靠近即打卡</p>
                    </div>
                </div>
                <div class="connection-status">
                    <div class="status-dot"></div>
                    <span>持续待机中</span>
                </div>
            </div>

            <!-- 主打卡区域 -->
            <div class="main-card-area">
                <div class="nfc-card-container">
                    <!-- 主圆圈 - 黑色 -->
                    <div class="circle-wrapper" id="circleWrapper">
                        <div class="hollow-circle circle-pulse" id="hollowCircle"></div>
                    </div>

                    <!-- 对勾容器 - 橙色 -->
                    <div class="check-container" id="checkContainer">
                        <svg class="checkmark-svg" viewBox="0 0 52 52">
                            <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                            <path class="checkmark-path" fill="none" d="M14 27l7 7 16-16"/>
                        </svg>
                    </div>

                    <!-- 发光圆圈 - 橙色 -->
                    <div class="glow-circle" id="glowCircle"></div>

                    <!-- 个人资讯卡片 - 白色 -->
                    <div class="info-card" id="infoCard">
                        <div class="info-header">
                            <div class="info-avatar" id="infoAvatar">👨‍💻</div>
                            <div class="info-title">
                                <h2 id="infoName">张明远</h2>
                                <p id="infoDept">研发中心 · 架构组</p>
                            </div>
                        </div>
                        <div class="info-details">
                            <div class="detail-item">
                                <div class="detail-label">工号</div>
                                <div class="detail-value" id="infoId">HW-2304</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">打卡时间</div>
                                <div class="detail-value" id="infoTime">08:32</div>
                            </div>
                            <span class="badge-orange" id="infoStatus">已打卡</span>
                        </div>
                    </div>
                </div>

                <!-- 状态文字 -->
                <div class="status-text" id="statusText">⚪ 等待NFC卡片...</div>

                <!-- 测试按钮 -->
                <button class="test-btn" id="testBtn">🔄 模拟打卡</button>
            </div>
        </div>

        <!-- 右侧：历史记录区 -->
        <div class="right-panel">
            <!-- 飞入目标 -->
            <div class="fly-target" id="flyTarget">📥</div>

            <!-- 右侧头部 -->
            <div class="right-header">
                <h2>打卡记录</h2>
                <div class="date-range">
                    <span>📅 2024年3月</span>
                    <span>本月累计 <span id="totalCountSpan">0</span> 次</span>
                </div>
            </div>

            <!-- 统计卡片 -->
            <div class="stats-cards">
                <div class="stat-card">
                    <div class="stat-label">今日打卡</div>
                    <div class="stat-value" id="todayCount">0</div>
                    <div class="stat-sub">已签到</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">连续打卡</div>
                    <div class="stat-value" id="streakCount">3</div>
                    <div class="stat-sub">最高 12天</div>
                </div>
            </div>

            <!-- 操作按钮 -->
            <div class="action-buttons">
                <button class="excel-btn" id="excelBtn">
                    <span>📊</span> 导出Excel
                </button>
                <button class="filter-btn" id="filterBtn">
                    <span>📅</span> 本月
                </button>
            </div>

            <!-- 历史记录列表 -->
            <div class="history-list" id="historyList">
                <!-- 动态插入 -->
            </div>
        </div>
    </div>

    <!-- 引入SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <script>
        (function() {
            // DOM元素
            const circleWrapper = document.getElementById('circleWrapper');
            const hollowCircle = document.getElementById('hollowCircle');
            const checkContainer = document.getElementById('checkContainer');
            const glowCircle = document.getElementById('glowCircle');
            const statusText = document.getElementById('statusText');
            const infoCard = document.getElementById('infoCard');
            const flyTarget = document.getElementById('flyTarget');
            const flightPath = document.getElementById('flightPath');
            const testBtn = document.getElementById('testBtn');
            const excelBtn = document.getElementById('excelBtn');
            const filterBtn = document.getElementById('filterBtn');
            const historyList = document.getElementById('historyList');
            const todayCount = document.getElementById('todayCount');
            const totalCountSpan = document.getElementById('totalCountSpan');
            const streakCount = document.getElementById('streakCount');
            
            // 资讯元素
            const infoAvatar = document.getElementById('infoAvatar');
            const infoName = document.getElementById('infoName');
            const infoDept = document.getElementById('infoDept');
            const infoId = document.getElementById('infoId');
            const infoTime = document.getElementById('infoTime');

            // 状态
            let nfcReader = null;
            let isScanning = false;
            let timeoutId = null;
            let checkTimeoutId = null;
            let historyRecords = [];

            // 员工数据库
            const staffDatabase = [
                {
                    name: '张明远',
                    dept: '研发中心 · 架构组',
                    id: 'HW-2304',
                    avatar: '👨‍💻'
                },
                {
                    name: '李思睿',
                    dept: '产品部 · 设计组',
                    id: 'HW-1789',
                    avatar: '👩‍🎨'
                },
                {
                    name: '王华强',
                    dept: '测试部 · 自动化',
                    id: 'HW-5521',
                    avatar: '👨‍🔧'
                },
                {
                    name: '赵一鸣',
                    dept: '销售部 · 华东区',
                    id: 'HW-3321',
                    avatar: '👨‍💼'
                },
                {
                    name: '孙小美',
                    dept: '人事部 · 招聘组',
                    id: 'HW-7788',
                    avatar: '👩‍💼'
                }
            ];

            // 获取当前完整日期时间
            function getCurrentDateTime() {
                const now = new Date();
                const year = now.getFullYear();
                const month = (now.getMonth() + 1).toString().padStart(2, '0');
                const day = now.getDate().toString().padStart(2, '0');
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                return {
                    date: `${year}-${month}-${day}`,
                    time: `${hours}:${minutes}`,
                    displayDate: `${month}/${day}`,
                    displayTime: `${hours}:${minutes}`
                };
            }

            // 显示飞入路径
            function showFlightPath() {
                const line = document.createElement('div');
                line.className = 'flight-line';
                flightPath.appendChild(line);
                setTimeout(() => line.remove(), 800);
            }

            // 重置对勾动画
            function resetCheckAnimation() {
                const svg = checkContainer.querySelector('svg');
                const newSvg = svg.cloneNode(true);
                checkContainer.replaceChild(newSvg, svg);
            }

            // 添加新记录
            function addHistoryRecord(employee) {
                const dt = getCurrentDateTime();
                
                const newRecord = {
                    id: Date.now(),
                    name: employee.name,
                    dept: employee.dept.split('·')[0].trim(),
                    fullDept: employee.dept,
                    empId: employee.id,
                    avatar: employee.avatar,
                    date: dt.date,
                    time: dt.time,
                    displayDate: dt.displayDate,
                    displayTime: dt.displayTime
                };
                
                historyRecords.unshift(newRecord);
                renderHistoryList();
                updateCounts();
            }

            // 渲染历史列表
            function renderHistoryList() {
                if (historyRecords.length === 0) {
                    historyList.innerHTML = '<div class="history-item" style="opacity: 0.6;"><div class="history-avatar">⏳</div><div class="history-info"><div class="history-name">等待打卡...</div><div class="history-meta"><span>--</span></div></div><div class="history-date"><div class="date">--</div><div class="time">--:--</div></div></div>';
                    return;
                }

                let html = '';
                historyRecords.slice(0, 10).forEach(record => {
                    html += `
                        <div class="history-item">
                            <div class="history-avatar">${record.avatar}</div>
                            <div class="history-info">
                                <div class="history-name">${record.name}</div>
                                <div class="history-meta">
                                    <span>${record.dept}</span>
                                    <span>${record.empId}</span>
                                </div>
                            </div>
                            <div class="history-date">
                                <div class="date">${record.displayDate}</div>
                                <div class="time">${record.displayTime}</div>
                            </div>
                        </div>
                    `;
                });
                historyList.innerHTML = html;
            }

            // 更新计数
            function updateCounts() {
                const today = new Date().toISOString().slice(0,10);
                const todayCount_num = historyRecords.filter(r => r.date === today).length;
                todayCount.textContent = todayCount_num;
                totalCountSpan.textContent = historyRecords.length;
                
                // 计算连续打卡（模拟）
                const streak = Math.min(historyRecords.length, 7);
                streakCount.textContent = streak;
            }

            // 导出Excel
            function exportToExcel() {
                let excelData = [];
                excelData.push(['日期', '时间', '姓名', '部门', '工号', '打卡状态']);
                
                if (historyRecords.length === 0) {
                    excelData.push(['暂无打卡记录', '', '', '', '', '']);
                } else {
                    historyRecords.forEach(record => {
                        excelData.push([
                            record.date,
                            record.time,
                            record.name,
                            record.fullDept || record.dept,
                            record.empId,
                            '已打卡'
                        ]);
                    });
                }
                
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(excelData);
                
                ws['!cols'] = [
                    { wch: 12 }, { wch: 8 }, { wch: 12 }, 
                    { wch: 20 }, { wch: 12 }, { wch: 8 }
                ];
                
                XLSX.utils.book_append_sheet(wb, ws, '打卡记录');
                XLSX.writeFile(wb, `打卡记录_${new Date().toISOString().slice(0,10)}.xlsx`);
            }

            // 打卡成功动画
            function showPunchSuccess() {
                const employee = staffDatabase[Math.floor(Math.random() * staffDatabase.length)];

                if (timeoutId) clearTimeout(timeoutId);
                if (checkTimeoutId) clearTimeout(checkTimeoutId);

                hollowCircle.classList.remove('circle-pulse');
                statusText.classList.add('hidden');
                
                const dt = getCurrentDateTime();
                infoAvatar.textContent = employee.avatar;
                infoName.textContent = employee.name;
                infoDept.textContent = employee.dept;
                infoId.textContent = employee.id;
                infoTime.textContent = dt.displayTime;
                
                infoCard.classList.add('show');
                glowCircle.classList.add('show');
                flyTarget.classList.add('show');
                
                timeoutId = setTimeout(() => {
                    showFlightPath();
                    addHistoryRecord(employee);
                    
                    infoCard.classList.remove('show');
                    glowCircle.classList.remove('show');
                    flyTarget.classList.remove('show');
                    
                    resetCheckAnimation();
                    checkContainer.classList.add('show');
                    
                    checkTimeoutId = setTimeout(() => {
                        checkContainer.classList.remove('show');
                        hollowCircle.classList.add('circle-pulse');
                        statusText.classList.remove('hidden');
                        statusText.innerHTML = '⚪ 等待NFC卡片...';
                        timeoutId = null;
                        checkTimeoutId = null;
                    }, 1500);
                    
                }, 1500);
            }

            // 初始化NFC
            async function initNfc() {
                if (!('NDEFReader' in window)) {
                    statusText.innerHTML = '❌ 浏览器不支持NFC';
                    return;
                }

                try {
                    nfcReader = new NDEFReader();
                    nfcReader.addEventListener('reading', () => showPunchSuccess());
                    await nfcReader.scan();
                    isScanning = true;
                    statusText.innerHTML = '🟢 持续待机中...';
                } catch (error) {
                    statusText.innerHTML = '❌ NFC启动失败';
                }
            }

            // 事件监听
            testBtn.addEventListener('click', showPunchSuccess);
            excelBtn.addEventListener('click', exportToExcel);
            filterBtn.addEventListener('click', () => alert('筛选功能开发中'));

            // 初始化
            window.addEventListener('load', () => {
                initNfc();
                
                // 添加示例数据
                setTimeout(() => {
                    if (historyRecords.length === 0) {
                        addHistoryRecord(staffDatabase[0]);
                        setTimeout(() => addHistoryRecord(staffDatabase[1]), 300);
                        setTimeout(() => addHistoryRecord(staffDatabase[2]), 600);
                        setTimeout(() => addHistoryRecord(staffDatabase[3]), 900);
                    }
                }, 1000);
            });

            // 清理
            window.addEventListener('beforeunload', async () => {
                if (isScanning && nfcReader) {
                    try { await nfcReader.stop(); } catch (e) {}
                }
                if (timeoutId) clearTimeout(timeoutId);
                if (checkTimeoutId) clearTimeout(checkTimeoutId);
            });
        })();
    </script>
</body>
</html>
